api_version = "2026-07"

[[extensions]]
# Change the merchant-facing name of the extension in locales/en.default.json
name = "t:name"
handle = "inventory-history"
type = "ui_extension"
uid = "9db7c884-2034-696c-fd06-684fb4e0b5ab24a7a514"

# "Inventory history" in the product page's More actions menu
[[extensions.targeting]]
module = "./src/ActionExtension.jsx"
target = "admin.product-details.action.render"

# Hides the menu item for staff without Inventory history access
[extensions.targeting.should_render]
module = "./src/condition/shouldRender.js"


